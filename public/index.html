<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ayseepee</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  * { scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d; --border-light: #484f58;
    --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff; --accent-dim: #1f6feb;
    --green: #3fb950; --red: #f85149; --yellow: #d29922; --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  #app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }

  /* Sidebar */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  .sidebar-header h1 span { color: var(--text-dim); font-weight: 400; }
  .sidebar-section { padding: 8px; border-bottom: 1px solid var(--border); }
  .sidebar-section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); padding: 4px 8px; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-list { list-style: none; overflow-y: auto; flex: 1; }
  .sidebar-item { padding: 6px 12px; cursor: pointer; border-radius: 6px; margin: 2px 4px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .sidebar-item:hover { background: rgba(255,255,255,0.05); }
  .sidebar-item.active { background: rgba(88,166,255,0.1); color: var(--accent); }
  .sidebar-item .status { font-size: 10px; padding: 1px 6px; border-radius: 10px; }
  .status-idle { background: rgba(63,185,80,0.15); color: var(--green); }
  .status-active { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .status-error { background: rgba(248,81,73,0.15); color: var(--red); }

  /* Buttons */
  .btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .btn:hover { border-color: var(--border-light); }
  .btn-sm { padding: 2px 8px; font-size: 11px; }
  .btn-primary { background: var(--accent-dim); border-color: var(--accent-dim); }
  .btn-primary:hover { background: var(--accent); }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { background: rgba(248,81,73,0.1); }

  /* Main area */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .main-header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; min-height: 49px; }
  .main-header h2 { font-size: 14px; font-weight: 600; }
  .main-header .meta { font-size: 12px; color: var(--text-dim); font-family: var(--mono); }

  .main-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 14px; }

  /* Messages feed */
  .messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .message-group { margin-bottom: 20px; }
  .message-prompt { font-size: 13px; color: var(--accent); margin-bottom: 8px; padding: 8px 12px; background: rgba(88,166,255,0.06); border-radius: 8px; border: 1px solid rgba(88,166,255,0.1); }
  .message-prompt .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-bottom: 4px; }
  .message-events { margin-left: 12px; border-left: 2px solid var(--border); padding-left: 12px; }
  .event { margin-bottom: 6px; font-size: 13px; }
  .event-type { font-family: var(--mono); font-size: 11px; color: var(--text-dim); background: rgba(255,255,255,0.04); padding: 1px 6px; border-radius: 4px; display: inline-block; margin-bottom: 2px; }
  .event-assistant { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
  .event-tool { font-family: var(--mono); font-size: 12px; color: var(--yellow); }
  .event-result { padding: 8px 12px; background: rgba(63,185,80,0.06); border: 1px solid rgba(63,185,80,0.1); border-radius: 6px; font-size: 12px; }
  .event-result.error { background: rgba(248,81,73,0.06); border-color: rgba(248,81,73,0.1); }
  .event-result .cost { color: var(--text-dim); font-family: var(--mono); }
  .event-model { font-size: 11px; color: var(--text-dim); font-family: var(--mono); background: rgba(255,255,255,0.04); padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  .event-tool-use { padding: 6px 10px; background: rgba(210,153,34,0.06); border: 1px solid rgba(210,153,34,0.1); border-radius: 6px; font-family: var(--mono); font-size: 12px; margin: 4px 0; }
  .event-tool-use .tool-name { color: var(--yellow); font-weight: 600; }
  .event-tool-use .tool-input { color: var(--text-dim); margin-top: 4px; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: auto; }
  .event-tool-result { padding: 6px 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto; margin: 4px 0; }
  .event-permission { padding: 8px 12px; background: rgba(88,166,255,0.06); border: 1px solid rgba(88,166,255,0.15); border-radius: 6px; font-size: 12px; margin: 4px 0; }
  .event-permission .perm-title { font-weight: 600; margin-bottom: 4px; }
  .event-permission .perm-desc { color: var(--text-dim); font-size: 11px; margin-bottom: 8px; }
  .event-permission .perm-actions { display: flex; gap: 8px; }
  .event-permission .perm-actions button { padding: 4px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid var(--border); }
  .event-permission .perm-resolved { font-style: italic; color: var(--text-dim); }

  .message-status { display: inline-block; font-size: 11px; font-family: var(--mono); padding: 1px 6px; border-radius: 4px; margin-left: 8px; }

  /* Input bar */
  .input-bar { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .input-bar input { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none; }
  .input-bar input:focus { border-color: var(--accent); }
  .input-bar input::placeholder { color: var(--text-dim); }

  /* Dialogs */
  .dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 400px; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; }
  .dialog.wide { width: 550px; }
  .dialog h3 { font-size: 15px; margin-bottom: 16px; }
  .dialog label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; margin-top: 12px; }
  .dialog input, .dialog select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  .dialog .actions { margin-top: 20px; display: flex; gap: 8px; justify-content: flex-end; }
  .hidden { display: none !important; }

  /* File picker */
  .filepicker { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); margin-top: 8px; max-height: 350px; min-height: 150px; display: flex; flex-direction: column; overflow: hidden; }
  .filepicker-path { font-family: var(--mono); font-size: 12px; color: var(--text-dim); padding: 6px 10px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  .filepicker-crumbs { display: flex; align-items: center; gap: 2px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .filepicker-crumbs span { cursor: pointer; color: var(--accent); }
  .filepicker-crumbs span:hover { text-decoration: underline; }
  .filepicker-toggle { display: flex; flex-direction: column; align-items: center; gap: 1px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; color: var(--text-dim); cursor: pointer; user-select: none; white-space: nowrap; flex-shrink: 0; }
  .filepicker-list { list-style: none; overflow-y: auto; flex: 1; }
  .filepicker-item { padding: 4px 10px; cursor: pointer; font-size: 13px; font-family: var(--mono); display: flex; align-items: center; gap: 6px; }
  .filepicker-item:hover { background: rgba(255,255,255,0.05); }
  .filepicker-item.selected { background: rgba(88,166,255,0.12); color: var(--accent); }
  .filepicker-icon { width: 16px; text-align: center; font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

  /* Toast */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--red); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 200; max-width: 500px; text-align: center; }
</style>
</head>
<body>

<div id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>ayseepee <span>v1</span></h1>
    </div>
    <div class="sidebar-section">
      <h2>Workspaces <button class="btn btn-sm" onclick="showCreateWorkspace()">+</button></h2>
    </div>
    <ul class="sidebar-list" id="workspace-list"></ul>
    <div class="sidebar-section">
      <h2>Sessions <button class="btn btn-sm" id="btn-new-session" onclick="showCreateSession()">+</button></h2>
    </div>
    <ul class="sidebar-list" id="session-list"></ul>
  </div>

  <div class="main">
    <div class="main-header">
      <div>
        <h2 id="main-title">Select a session</h2>
        <div class="meta" id="main-meta"></div>
      </div>
      <div id="main-actions"></div>
    </div>
    <div class="main-empty" id="empty-state">Create a workspace and session to get started</div>
    <div class="messages hidden" id="messages-feed"></div>
    <div class="input-bar hidden" id="input-bar">
      <input type="text" id="prompt-input" placeholder="Send a message..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<!-- Create Workspace Dialog -->
<div class="dialog-overlay hidden" id="dialog-workspace">
  <div class="dialog wide">
    <h3>New Workspace</h3>
    <label>Directory</label>
    <div class="filepicker" id="filepicker">
      <div class="filepicker-path" id="filepicker-path"></div>
      <ul class="filepicker-list" id="filepicker-list"></ul>
    </div>
    <label>Name</label>
    <input type="text" id="ws-name" placeholder="my-project">
    <label>Permission Mode</label>
    <select id="ws-permission">
      <option value="default" selected>Default</option>
      <option value="acceptEdits">Accept Edits</option>
      <option value="bypassPermissions">Bypass Permissions</option>
      <option value="plan">Plan</option>
    </select>
    <div class="actions">
      <button class="btn" onclick="hideDialog('dialog-workspace')">Cancel</button>
      <button class="btn btn-primary" onclick="createWorkspace()">Create</button>
    </div>
  </div>
</div>

<!-- Create Session Dialog -->
<div class="dialog-overlay hidden" id="dialog-session">
  <div class="dialog">
    <h3>New Session</h3>
    <label>Name (optional)</label>
    <input type="text" id="sess-name" placeholder="bug-fix">
    <label>Model</label>
    <select id="sess-model">
      <option value="sonnet" selected>Sonnet</option>
      <option value="opus">Opus</option>
      <option value="haiku">Haiku</option>
    </select>
    <label>Permission Mode (optional, inherits from workspace)</label>
    <select id="sess-permission">
      <option value="">(inherit from workspace)</option>
      <option value="default">Default</option>
      <option value="acceptEdits">Accept Edits</option>
      <option value="bypassPermissions">Bypass Permissions</option>
      <option value="plan">Plan</option>
    </select>
    <div class="actions">
      <button class="btn" onclick="hideDialog('dialog-session')">Cancel</button>
      <button class="btn btn-primary" onclick="createSession()">Create</button>
    </div>
  </div>
</div>

<script>
const API = '/api/v1';

// API key: check URL param first, then localStorage
const urlKey = new URLSearchParams(window.location.search).get('api_key');
let apiKey = urlKey || localStorage.getItem('ayseepee_api_key') || '';
if (urlKey) {
  localStorage.setItem('ayseepee_api_key', urlKey);
  // Strip key from URL so it's not visible in browser history
  const clean = new URL(window.location.href);
  clean.searchParams.delete('api_key');
  window.history.replaceState({}, '', clean.pathname + clean.search);
}

let state = {
  workspaces: [],
  sessions: [],
  activeWorkspaceId: null,
  activeSessionId: null,
  messages: [],     // message objects for current session
  pollTimers: {},   // messageId -> intervalId
};

// --- API helpers ---
async function api(method, path, body) {
  const opts = { method, headers: { 'Authorization': `Bearer ${apiKey}` } };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  if (res.status === 401) {
    promptForApiKey('Invalid API key.');
    throw new Error('Unauthorized');
  }
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) {
    showError(data.error || `Request failed (${res.status})`);
    throw new Error(data.error || `Request failed (${res.status})`);
  }
  return data;
}

function showError(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.add('hidden'), 5000);
}

function promptForApiKey(msg) {
  const key = prompt(msg ? msg + ' Enter API key:' : 'Enter API key:');
  if (key) {
    apiKey = key.trim();
    localStorage.setItem('ayseepee_api_key', apiKey);
    loadWorkspaces();
  }
}

// --- Workspaces ---
async function loadWorkspaces() {
  try {
    state.workspaces = await api('GET', '/workspaces');
    renderWorkspaces();
  } catch (e) {
    if (e.message !== 'Unauthorized') throw e;
  }
}

function renderWorkspaces() {
  const el = document.getElementById('workspace-list');
  el.innerHTML = state.workspaces.map(w => `
    <li class="sidebar-item ${w.id === state.activeWorkspaceId ? 'active' : ''}"
        onclick="selectWorkspace('${w.id}')">
      <span>${esc(w.name)}</span>
      <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteWorkspace('${w.id}')">&times;</button>
    </li>
  `).join('');
}

async function selectWorkspace(id) {
  state.activeWorkspaceId = id;
  state.activeSessionId = null;
  renderWorkspaces();
  await loadSessions();
  showEmptyState();
}

// --- File picker ---
let pickerCwd = '/';
let pickerOpen = new Set();

function showCreateWorkspace() {
  document.getElementById('ws-name').value = '';
  pickerCwd = '/';
  pickerOpen.clear();
  showDialog('dialog-workspace');
  loadPicker();
}

async function loadPicker() {
  const showHidden = document.getElementById('filepicker-hidden')?.checked ?? false;
  const data = await api('POST', '/files/list', { root: pickerCwd, open: [...pickerOpen], showHidden });
  renderPicker(data);
}

function renderPicker(data) {
  // Breadcrumb path + hidden toggle
  const pathEl = document.getElementById('filepicker-path');
  const parts = pickerCwd.split('/').filter(Boolean);
  let crumbs = `<span onclick="pickerNavigate('/')">/</span>`;
  let built = '';
  for (const p of parts) {
    built += '/' + p;
    const target = built;
    crumbs += `<span onclick="pickerNavigate('${esc(target)}')">${esc(p)}/</span>`;
  }
  const checked = document.getElementById('filepicker-hidden')?.checked ? 'checked' : '';
  pathEl.innerHTML = `<div class="filepicker-crumbs">${crumbs}</div><label class="filepicker-toggle"><input type="checkbox" id="filepicker-hidden" ${checked} onchange="loadPicker()"><div>hidden</div></label>`;

  // Build flat list with indentation
  const listEl = document.getElementById('filepicker-list');
  let html = '';

  function renderDir(key, entries) {
    const depth = key === '/' ? 0 : key.split('/').filter(Boolean).length;
    const pad = 10 + depth * 16;
    for (const e of entries) {
      const relPath = key === '/' ? e.name : key.slice(1) + '/' + e.name;
      if (e.type === 'directory') {
        const isOpen = pickerOpen.has(relPath);
        const absPath = pickerCwd.replace(/\/$/, '') + '/' + relPath;
        html += `<li class="filepicker-item" style="padding-left:${pad}px">
          <span class="filepicker-icon" onclick="event.stopPropagation();pickerToggle('${esc(relPath)}')">${isOpen ? '\u25BE' : '\u25B8'}</span>
          <span onclick="pickerNavigate('${esc(absPath)}')">${esc(e.name)}/</span>
        </li>`;
        // Render children if open
        if (isOpen && data.entries['/' + relPath]) {
          renderDir('/' + relPath, data.entries['/' + relPath]);
        }
      } else {
        html += `<li class="filepicker-item" style="padding-left:${pad}px;color:var(--text-dim);cursor:default">
          <span class="filepicker-icon">&middot;</span>${esc(e.name)}
        </li>`;
      }
    }
  }

  if (data.entries['/']) {
    renderDir('/', data.entries['/']);
  }
  listEl.innerHTML = html;
}

function pickerNavigate(path) {
  pickerCwd = path;
  pickerOpen.clear();
  // Auto-fill name from last directory segment
  const segments = path.split('/').filter(Boolean);
  if (segments.length > 0) {
    document.getElementById('ws-name').value = segments[segments.length - 1];
  }
  loadPicker();
}

function pickerToggle(relPath) {
  if (pickerOpen.has(relPath)) {
    // Close this and any children
    for (const p of [...pickerOpen]) {
      if (p === relPath || p.startsWith(relPath + '/')) pickerOpen.delete(p);
    }
  } else {
    pickerOpen.add(relPath);
  }
  loadPicker();
}

function pickerSelectedPath() {
  return pickerCwd;
}

async function createWorkspace() {
  const name = document.getElementById('ws-name').value.trim();
  const cwd = pickerSelectedPath();
  const permissionMode = document.getElementById('ws-permission').value;
  if (!name || !cwd || cwd === '/') {
    showError('Select a directory and enter a name');
    return;
  }
  await api('POST', '/workspaces', { name, cwd, permissionMode });
  hideDialog('dialog-workspace');
  await loadWorkspaces();
}

async function deleteWorkspace(id) {
  const res = await api('DELETE', `/workspaces/${id}`);
  if (res && res.error) { alert(res.error); return; }
  if (state.activeWorkspaceId === id) {
    state.activeWorkspaceId = null;
    state.activeSessionId = null;
    document.getElementById('session-list').innerHTML = '';
    showEmptyState();
  }
  await loadWorkspaces();
}

// --- Sessions ---
async function loadSessions() {
  if (!state.activeWorkspaceId) { state.sessions = []; renderSessions(); return; }
  state.sessions = await api('GET', `/workspaces/${state.activeWorkspaceId}/sessions`);
  renderSessions();
  // Keep title in sync
  if (state.activeSessionId) {
    const s = state.sessions.find(s => s.id === state.activeSessionId);
    if (s) document.getElementById('main-title').textContent = s.name || s.id.slice(0, 8);
  }
}

function renderSessions() {
  const el = document.getElementById('session-list');
  el.innerHTML = state.sessions.map(s => `
    <li class="sidebar-item ${s.id === state.activeSessionId ? 'active' : ''}"
        onclick="selectSession('${s.id}')">
      <span>${esc(s.name || s.id.slice(0, 8))}</span>
      <span class="status status-${s.status}">${s.status}</span>
    </li>
  `).join('');
}

function showCreateSession() {
  if (!state.activeWorkspaceId) {
    showError('Select a workspace first');
    return;
  }
  document.getElementById('sess-name').value = '';
  document.getElementById('sess-model').value = 'sonnet';
  document.getElementById('sess-permission').value = '';
  showDialog('dialog-session');
}

async function createSession() {
  const name = document.getElementById('sess-name').value.trim();
  const model = document.getElementById('sess-model').value;
  const permissionMode = document.getElementById('sess-permission').value;
  const body = { model };
  if (name) body.name = name;
  if (permissionMode) body.permissionMode = permissionMode;
  const s = await api('POST', `/workspaces/${state.activeWorkspaceId}/sessions`, body);
  hideDialog('dialog-session');
  await loadSessions();
  selectSession(s.id);
}

async function selectSession(id) {
  state.activeSessionId = id;
  renderSessions();
  await loadSessionView();
}

// --- Session view ---
async function loadSessionView() {
  if (!state.activeSessionId) { showEmptyState(); return; }

  const session = state.sessions.find(s => s.id === state.activeSessionId);
  const workspace = state.workspaces.find(w => w.id === state.activeWorkspaceId);

  const titleEl = document.getElementById('main-title');
  titleEl.textContent = session?.name || session?.id.slice(0, 8) || 'Session';
  titleEl.style.cursor = 'pointer';
  titleEl.title = 'Click to rename';
  titleEl.onclick = () => {
    const name = prompt('Rename session:', titleEl.textContent);
    if (name !== null && name.trim()) updateSessionSetting('name', name.trim());
  };
  document.getElementById('main-meta').textContent = workspace?.cwd || '';
  const permMode = session?.permissionMode || workspace?.permissionMode || 'default';
  const modelVal = session?.model || '';
  document.getElementById('main-actions').innerHTML = `
    <select id="session-model" class="btn btn-sm" onchange="updateSessionSetting('model', this.value)">
      <option value="sonnet" ${!modelVal || modelVal === 'sonnet' ? 'selected' : ''}>Sonnet</option>
      <option value="opus" ${modelVal === 'opus' ? 'selected' : ''}>Opus</option>
      <option value="haiku" ${modelVal === 'haiku' ? 'selected' : ''}>Haiku</option>
    </select>
    <select id="session-perm" class="btn btn-sm" onchange="updateSessionSetting('permissionMode', this.value)">
      <option value="" ${!session?.permissionMode ? 'selected' : ''}>(inherit: ${permModeLabel(workspace?.permissionMode)})</option>
      <option value="default" ${session?.permissionMode === 'default' ? 'selected' : ''}>Default</option>
      <option value="acceptEdits" ${session?.permissionMode === 'acceptEdits' ? 'selected' : ''}>Accept Edits</option>
      <option value="bypassPermissions" ${session?.permissionMode === 'bypassPermissions' ? 'selected' : ''}>Bypass Permissions</option>
      <option value="plan" ${session?.permissionMode === 'plan' ? 'selected' : ''}>Plan</option>
    </select>
    <button class="btn btn-sm btn-danger" onclick="deleteSession('${state.activeSessionId}')">Delete</button>
  `;

  document.getElementById('empty-state').classList.add('hidden');
  document.getElementById('messages-feed').classList.remove('hidden');
  document.getElementById('input-bar').classList.remove('hidden');

  // Load messages from the server
  const msgs = await api('GET', `/sessions/${state.activeSessionId}/messages`);
  state.messages[state.activeSessionId] = msgs.map(m => ({
    id: m.id,
    prompt: m.prompt,
    status: m.status,
    result: m.result,
    events: m.events || [],
    lastEventId: m.events?.length ? m.events[m.events.length - 1].id : 0,
  }));

  // Resume polling for any active messages
  for (const m of state.messages[state.activeSessionId]) {
    if (m.status === 'pending' || m.status === 'streaming') {
      startPolling(m.id);
    }
  }

  renderMessages();
}

async function loadMessages() {
  // Get session messages by querying each known message
  // For now, we track messages client-side per session
  const feed = document.getElementById('messages-feed');
  if (!state.messages[state.activeSessionId]) {
    state.messages[state.activeSessionId] = [];
  }
  renderMessages();
}

function renderMessages() {
  const feed = document.getElementById('messages-feed');
  const msgs = state.messages[state.activeSessionId] || [];

  if (msgs.length === 0) {
    feed.innerHTML = '<div style="color: var(--text-dim); text-align: center; margin-top: 40px; font-size: 13px;">No messages yet. Send a prompt to begin.</div>';
    return;
  }

  feed.innerHTML = msgs.map(m => `
    <div class="message-group" id="msg-${m.id}">
      <div class="message-prompt">
        <div class="label">You</div>
        ${esc(m.prompt)}
      </div>
      <div class="message-events" id="events-${m.id}">
        ${renderEvents(m)}
      </div>
    </div>
  `).join('');

  feed.scrollTop = feed.scrollHeight;
}

function renderEvents(msg) {
  const isActive = msg.status === 'pending' || msg.status === 'streaming';

  if (!msg.events || msg.events.length === 0) {
    return isActive ? '<div class="event"><span class="event-type">waiting...</span></div>' : '';
  }

  const rendered = msg.events.map(e => {
    if (e.data?.type === 'assistant') {
      const parts = [];
      const content = e.data?.message?.content || [];
      for (const block of content) {
        if (block.type === 'text' && block.text) {
          parts.push(`<div class="event-assistant">${esc(block.text)}</div>`);
        } else if (block.type === 'tool_use') {
          parts.push(`<div class="event-tool-use">
            <span class="tool-name">${esc(block.name)}</span>
            <div class="tool-input">${esc(formatToolInput(block.input))}</div>
          </div>`);
        }
      }
      return parts.length ? `<div class="event">${parts.join('')}</div>` : '';
    }
    if (e.type === 'permission_request') {
      const resolved = e.data.resolved;
      const inner = (resolved && resolved !== 'pending')
        ? `<div class="perm-resolved">${resolved === 'allowed' ? 'Allowed' : 'Denied'}</div>`
        : `<div class="perm-actions">
            <button class="btn btn-sm" style="background:var(--green);color:#000;border:none;" onclick="resolvePermission('${e.data.id}', true)">Allow</button>
            <button class="btn btn-sm" style="background:var(--red);color:#fff;border:none;" onclick="resolvePermission('${e.data.id}', false)">Deny</button>
          </div>`;
      return `<div class="event"><div class="event-permission">
        <div class="perm-title">${esc(e.data.title || e.data.tool_name)}</div>
        ${e.data.description ? `<div class="perm-desc">${esc(e.data.description)}</div>` : ''}
        ${inner}
      </div></div>`;
    }
    if (e.type?.startsWith('result')) {
      const isError = e.data?.is_error;
      const model = e.data?.modelUsage ? Object.keys(e.data.modelUsage)[0] : null;
      const modelTag = model ? `<span class="event-model">${esc(shortModel(model))}</span> ` : '';
      const errorText = isError && e.data?.error ? esc(e.data.error) : '';
      return `<div class="event"><div class="event-result ${isError ? 'error' : ''}">
        ${errorText}
        <div class="cost">${modelTag}${e.data?.total_cost_usd ? '$' + e.data.total_cost_usd.toFixed(4) : ''} ${e.data?.duration_ms ? (e.data.duration_ms / 1000).toFixed(1) + 's' : ''}</div>
      </div></div>`;
    }
    if (e.data?.type === 'user' && e.data?.tool_use_result !== undefined) {
      const result = formatToolResult(e.data.tool_use_result);
      if (!result) return '';
      return `<div class="event"><div class="event-tool-result">${esc(result)}</div></div>`;
    }
    if (e.data?.type === 'tool_use_summary') {
      return `<div class="event"><div class="event-tool-result">${esc(e.data.summary)}</div></div>`;
    }
    if (e.data?.type === 'system' && e.data?.subtype === 'init') return '';
    return '';
  }).join('');

  // If still active but all events rendered as empty (e.g. only system events), show waiting
  if (isActive && !rendered.trim()) {
    return rendered + '<div class="event"><span class="event-type">waiting...</span></div>';
  }
  return rendered;
}

function extractAssistantText(data) {
  if (!data?.message?.content) return '';
  return data.message.content
    .filter(c => c.type === 'text')
    .map(c => c.text)
    .join('');
}

// --- Send message ---
async function sendMessage() {
  if (!state.activeSessionId) return;
  const input = document.getElementById('prompt-input');
  const prompt = input.value.trim();
  if (!prompt) return;
  input.value = '';

  const res = await api('POST', `/sessions/${state.activeSessionId}/messages`, { prompt });
  if (res.error) { alert(res.error); return; }

  if (!state.messages[state.activeSessionId]) {
    state.messages[state.activeSessionId] = [];
  }
  state.messages[state.activeSessionId].push({
    id: res.id,
    prompt,
    status: 'pending',
    events: [],
    lastEventId: 0,
  });

  renderMessages();
  startPolling(res.id);
}

function startPolling(messageId) {
  if (state.pollTimers[messageId]) return;
  state.pollTimers[messageId] = setInterval(() => pollMessage(messageId), 1000);
}

async function pollMessage(messageId) {
  const msgs = state.messages[state.activeSessionId];
  if (!msgs) return;
  const msg = msgs.find(m => m.id === messageId);
  if (!msg) return;

  const data = await api('GET', `/messages/${messageId}?after=${msg.lastEventId}`);
  if (!data) return;

  msg.status = data.status;
  msg.result = data.result;
  msg.costUsd = data.costUsd;
  msg.durationMs = data.durationMs;

  if (data.events && data.events.length > 0) {
    msg.events.push(...data.events);
    msg.lastEventId = data.events[data.events.length - 1].id;
  }

  renderMessages();

  // Also refresh session status in sidebar
  loadSessions();

  if (data.status === 'complete' || data.status === 'error') {
    clearInterval(state.pollTimers[messageId]);
    delete state.pollTimers[messageId];
  }
}

async function resolvePermission(id, allow) {
  await api('POST', `/permissions/${id}/resolve`, { allow });
  // Update the event data locally so re-render reflects it immediately
  const msgs = state.messages[state.activeSessionId] || [];
  for (const m of msgs) {
    const ev = (m.events || []).find(e => e.data?.id === id);
    if (ev) ev.data.resolved = allow ? 'allowed' : 'denied';
  }
  renderMessages();
}

function formatToolResult(result) {
  if (!result) return '';
  if (typeof result === 'string') return result;
  // Bash tool results: extract stdout/stderr
  if (typeof result === 'object' && ('stdout' in result || 'stderr' in result)) {
    const parts = [];
    if (result.stdout) parts.push(result.stdout);
    if (result.stderr) parts.push(result.stderr);
    return parts.join('\n').trim();
  }
  // Content arrays (Read tool, etc.)
  if (Array.isArray(result)) {
    return result.map(r => r.text || r.content || JSON.stringify(r)).join('\n');
  }
  return JSON.stringify(result, null, 2);
}

function formatToolInput(input) {
  if (!input || typeof input !== 'object') return String(input || '');
  const entries = Object.entries(input);
  return entries.map(([k, v]) => {
    const val = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
    return `${k}: ${val}`;
  }).join('\n');
}

async function updateSessionSetting(field, value) {
  if (!state.activeSessionId) return;
  const updated = await api('PATCH', `/sessions/${state.activeSessionId}`, { [field]: value });
  const idx = state.sessions.findIndex(s => s.id === state.activeSessionId);
  if (idx >= 0) state.sessions[idx] = updated;
  await loadSessions();
}

async function deleteSession(id) {
  await api('DELETE', `/sessions/${id}`);
  delete state.messages[id];
  state.activeSessionId = null;
  showEmptyState();
  await loadSessions();
}

// --- UI helpers ---
function showEmptyState() {
  document.getElementById('main-title').textContent = 'Select a session';
  document.getElementById('main-meta').textContent = '';
  document.getElementById('main-actions').innerHTML = '';
  document.getElementById('empty-state').classList.remove('hidden');
  document.getElementById('messages-feed').classList.add('hidden');
  document.getElementById('input-bar').classList.add('hidden');
}

function showDialog(id) { document.getElementById(id).classList.remove('hidden'); }
function hideDialog(id) { document.getElementById(id).classList.add('hidden'); }

function permModeLabel(mode) {
  const map = { default: 'Default', acceptEdits: 'Accept Edits', bypassPermissions: 'Bypass Permissions', plan: 'Plan' };
  return map[mode] || mode || 'Default';
}

function shortModel(model) {
  const map = { opus: 'Opus', sonnet: 'Sonnet', haiku: 'Haiku' };
  return map[model] || model;
}

function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Catch unhandled promise rejections (api errors already show toast, just suppress console noise)
window.addEventListener('unhandledrejection', e => {
  if (e.reason?.message === 'Unauthorized') { e.preventDefault(); return; }
  if (e.reason?.message) showError(e.reason.message);
  e.preventDefault();
});

// Close dialogs on overlay click
document.querySelectorAll('.dialog-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.add('hidden'); });
});

// Boot
if (!apiKey) {
  promptForApiKey();
} else {
  loadWorkspaces();
}
</script>
<div class="toast hidden" id="toast"></div>
</body>
</html>
